<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Productivity Dashboard</title>
</head>
<body>
    <main>
        <nav>
            <h3>Hello, Boss</h3>
            <button id="chngtheme">🌚</button>
        </nav>

        <div class="motivation">
            <h3 id="motive">One Day you will get everything</h3>
            <div class="weather">
                <p id="city">Delhi</p>
                <p id="temp">20C</p>
            </div>
        </div>

        <section>
        <div class="elem" id="0">
            <img src="https://images.unsplash.com/photo-1773332598414-44a45e364d85?q=80&w=687&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDF8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D" alt="">
            <h1>Todo List</h1>
        </div>

        <div class="elem" id="1">
            <img src="https://plus.unsplash.com/premium_photo-1705010663785-4e8838166217?q=80&w=687&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D" alt="">
            <h1>Daily Planner</h1>
        </div>

        <div class="elem" id="2">
            <img src="https://images.unsplash.com/photo-1664994817539-8a865f12dc6c?q=80&w=765&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D" alt="">

        </div>

        <div class="elem" id="3">
            <img src="https://plus.unsplash.com/premium_photo-1683749805319-2c481ae54bc1?q=80&w=715&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D" alt="">
            <h1>Achievements</h1>
        </div>
        </section>
    </main>

        <div class="full-elem" id="0">
            <div class="nav">
                <h1>To Do List</h1>
                <button class="back" id="0">X</button>
            </div>  
            <div class="todocontent">
                <div class="addTask">
                    <input type="text">
                    <textarea name="" id="" cols="30" rows="10"></textarea>
                    <button type="submit">Add Task</button>
                </div>
                <div class="showTask">
                    <details>
                        <summary>Task 1</summary>
                        <p>How to perform</p>
                    </details>
                    <details>
                        <summary>Task 1</summary>
                        <p>How to perform</p>
                    </details>
                    <details>
                        <summary>Task 1</summary>
                        <p>How to perform</p>
                    </details>
                </div>
            </div>
        </div>

        <div class="full-elem" id="1">
            <div class="nav">
                <h1>Daily Planner</h1>
                <button class="back" id="1">X</button>
            </div>
        </div>

        <div class="full-elem" id="2">
            <div class="nav">
                <h1>Pomodoro Timer</h1>
                <button class="back" id="2">X</button>
            </div>
        </div>

        <div class="full-elem" id="3">
            <div class="nav">
                <h1>Achievements</h1>
